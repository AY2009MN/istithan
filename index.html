<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e2327">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>نموذج استئذان</title>
</head>
<body>
<nav class="bar no-print">
  <button data-act="new">نموذج جديد</button>
  <button data-act="print">طباعة</button>
  <button data-act="pdf">PDF</button>
  <button data-act="img">صورة</button>
  <label>الختم<input id="stamp-file" type="file" accept="image/png,image/jpeg" hidden></label>
</nav>

<main id="sheet" class="sheet">
  <header class="head">
    <div class="gov">
      <img src="img/moe.png" alt="">
      <div>وزارة التربية<br>منطقة العاصمة التعليمية<br>مدرسة يوسف السيد هاشم الرفاعي م. بنين</div>
    </div>
    <h1>نموذج استئذان</h1>
    <img class="logo" src="img/school.png" alt="">
  </header>

  <section class="box row">
    <label>اليوم:</label><input data-k="day" readonly tabindex="-1">
    <label>التاريخ:</label><input data-k="date" type="date">
  </section>

  <div class="row">
    <label>اسم المعلم:</label><input data-k="name" maxlength="60" autocomplete="off">
    <label>الرقم المدني:</label><input data-k="civil" maxlength="12" inputmode="numeric" autocomplete="off">
  </div>
  <div class="row"><label>القسم:</label><input data-k="dept" maxlength="40"></div>

  <section class="box">
    <div class="row">
      <label>سبب الاستئذان:</label><input data-k="reason" maxlength="80">
      <label>رقم الاستئذان:</label>
    </div>
    <div class="row opts">
      <label><input type="radio" name="no" data-k="no" value="1"><i></i>1</label>
      <label><input type="radio" name="no" data-k="no" value="2"><i></i>2</label>
      <label><input type="radio" name="no" data-k="no" value="3"><i></i>3</label>
      <label><input type="radio" name="no" data-k="no" value="4"><i></i>4</label>
    </div>
  </section>

  <h2>جدول المعلم</h2>
  <table id="t-periods"></table>

  <div class="row opts">
    <span>المتابعة اليومية:</span>
    <label><input type="radio" name="follow" data-k="follow" value="yes"><i></i>يوجد</label>
    <label><input type="radio" name="follow" data-k="follow" value="no"><i></i>لا يوجد</label>
  </div>
  <div class="row opts">
    <span>نوع الاستئذان:</span>
    <label><input type="radio" name="kind" data-k="kind" value="task"><i></i>تكليف</label>
    <label><input type="radio" name="kind" data-k="kind" value="official"><i></i>رسمي</label>
  </div>

  <table id="t-sign"></table>
</main>

<script src="js/vendor/html2canvas.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
